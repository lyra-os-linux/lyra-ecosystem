<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vega</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="window" id="window">
    <aside class="sidebar" id="sidebar" aria-label="Navegação">
      <header class="sidebar-header" data-drag>
        <div class="brand" data-drag><span class="brand-mark" id="brand-mark"></span><span data-drag>Vega</span></div>
        <button class="icon-btn" id="menu-btn" aria-label="Menu principal" title="Menu principal"></button>
      </header>
      <button class="search-trigger" id="search-trigger"><span class="ic" id="search-ic"></span><span>Buscar no Vega</span><kbd>Ctrl K</kbd></button>
      <nav class="nav" id="nav"></nav>
      <footer class="sidebar-footer">
        <button class="host-chip" id="host-chip" title="Informações do sistema">
          <span class="host-avatar" id="host-avatar"></span>
          <span class="host-meta"><strong id="host-name">…</strong><small><i class="status-dot" id="backend-dot"></i><span id="backend-label">Conectando ao vegad…</span></small></span>
        </button>
      </footer>
    </aside>

    <main class="content">
      <header class="headerbar" id="headerbar" data-drag>
        <button class="icon-btn only-narrow" id="sidebar-toggle" aria-label="Mostrar navegação"></button>
        <div class="title-wrap" data-drag><h1 id="page-title" data-drag></h1><span class="crumb" id="page-crumb" data-drag></span></div>
        <div class="header-actions" id="header-actions"></div>
        <button class="icon-btn" id="jobs-btn" aria-label="Tarefas" title="Tarefas"></button>
        <div class="window-controls" id="window-controls"></div>
      </header>
      <div class="scroller" id="scroller">
        <div class="page" id="page"></div>
      </div>
    </main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
